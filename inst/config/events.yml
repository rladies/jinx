# The Meetup endpoint and credentials are meetupr's concern, not
# jinx's - it targets the current gql-ext endpoint and owns the JWT
# exchange. The base_url and env_var keys that used to live here were
# never read (the endpoint was hardcoded) and pointed at the retired
# api.meetup.com/gql, so they have been removed rather than corrected.
sync:
  archive_repo: event-archive
  frequency: weekly

# The chapter list is derived from the website's data/chapters entries by
# chapter_meetup_groups(); a list here would drift the day it was written.
