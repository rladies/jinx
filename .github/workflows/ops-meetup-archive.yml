name: Ops · Meetup Archive

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-meetup-archive.yml"

concurrency:
  group: ops-meetup-archive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RENV_PATHS_ROOT: ~/.cache/R/renv
      RENV_PROFILE: archive
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JINX_APP_ID }}
          private-key: ${{ secrets.JINX_PRIVATE_KEY }}
          owner: rladies
          repositories: meetup_archive
          permission-contents: write

      - name: Checkout meetup_archive
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: rladies/meetup_archive
          ref: main

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsecret-1-dev libx11-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "renv"
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v6
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ runner.os }}-renv-archive-${{ hashFiles('renv/profiles/archive/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-archive-

      - name: Restore packages
        shell: Rscript {0}
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          renv::restore()

      - name: Archive Meetup data
        env:
          MEETUPR_CLIENT_NAME: meetupr
          meetupr_client_key: ${{ secrets.MEETUP_CLIENT_KEY }}
          meetupr_jwt_issuer: ${{ secrets.MEETUP_MEMBER_ID }}
          meetupr_jwt_token: ${{ secrets.MEETUP_PRIVATE_KEY }}
        run: Rscript scripts/archive_all.R

      - name: Prepare website data
        run: Rscript scripts/data_prep_website.R

      - name: Commit and push
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add data/ archive/
          if git diff --cached --quiet; then
            echo "No Meetup data changes to commit"
            exit 0
          fi
          git commit -m "Update meetup data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/rladies/meetup_archive.git" HEAD:main

  notify-failure:
    needs: archive
    if: failure() && github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-slack-fail-notify.yml
    with:
      message: "😿 Meetup archive failed — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run logs>"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_ORGANISER_TOKEN }}
      SLACK_CHANNEL: ${{ secrets.SLACK_HEALTHCHECK_CHANNEL }}
