name: Ops · Chapter Onboarding

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform
        required: true
        type: choice
        options:
          - setup
          - update
          - website
      city:
        description: Chapter city
        required: true
      country:
        description: Chapter country
        required: true
      region:
        description: State/region/province (optional)
        required: false
      organizers:
        description: Organizer names, comma separated (website action)
        required: false
      issue:
        description: Onboarding issue number (website action)
        required: false

concurrency:
  group: ops-chapter-onboarding-${{ inputs.city }}-${{ inputs.country }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JINX_APP_ID }}
          private-key: ${{ secrets.JINX_PRIVATE_KEY }}
          owner: rladies

      - name: Checkout jinx
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: rladies/jinx

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      - name: Run chapter onboarding
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTION: ${{ inputs.action }}
          CITY: ${{ inputs.city }}
          COUNTRY: ${{ inputs.country }}
          REGION: ${{ inputs.region }}
          ORGANIZERS: ${{ inputs.organizers }}
          ISSUE: ${{ inputs.issue }}
        run: |
          Rscript -e '
            action  <- Sys.getenv("ACTION")
            city    <- Sys.getenv("CITY")
            country <- Sys.getenv("COUNTRY")
            region  <- Sys.getenv("REGION")
            if (!nzchar(region)) region <- NULL
            organizers <- Sys.getenv("ORGANIZERS")
            organizers <- if (nzchar(organizers)) {
              trimws(strsplit(organizers, ",")[[1]])
            } else {
              character(0)
            }
            if (action == "setup") {
              jinx::chapter_create_setup(
                city = city,
                country = country,
                organizers = organizers,
                region = region
              )
            } else if (action == "website") {
              issue <- Sys.getenv("ISSUE")
              if (!nzchar(issue)) stop("the website action needs an issue number")
              jinx::chapter_onboard_website(
                issue_number = as.integer(issue),
                city = city,
                country = country,
                region = region,
                organizers = organizers
              )
            } else {
              jinx::chapter_create_update(city = city, country = country)
            }
          '
