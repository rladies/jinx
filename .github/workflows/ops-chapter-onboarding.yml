name: Ops · Chapter Onboarding

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform
        required: true
        type: choice
        options:
          - setup
          - update
          - website
          - confirm
      city:
        description: Chapter city (optional for the website action)
        required: false
      country:
        description: Chapter country (optional for the website action)
        required: false
      region:
        description: State/region/province (optional)
        required: false
      organizers:
        description: Organizer names, comma separated (optional for the website action)
        required: false
      issue:
        description: Onboarding issue number (website and confirm actions)
        required: false
      emails:
        description: Organiser emails, comma separated (confirm action). Not written to the issue.
        required: false
      chapter_email:
        description: Chapter email to quote in the confirmation (confirm action)
        required: false
      meetup_url:
        description: Meetup URL to quote in the confirmation (confirm action)
        required: false
      force:
        description: Confirm even with checklist steps outstanding
        required: false
        type: boolean
        default: false

concurrency:
  group: ops-chapter-onboarding-${{ inputs.city }}-${{ inputs.country }}-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JINX_APP_ID }}
          private-key: ${{ secrets.JINX_PRIVATE_KEY }}
          owner: rladies

      - name: Checkout jinx
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: rladies/jinx

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      - name: Run chapter onboarding
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTION: ${{ inputs.action }}
          CITY: ${{ inputs.city }}
          COUNTRY: ${{ inputs.country }}
          REGION: ${{ inputs.region }}
          ORGANIZERS: ${{ inputs.organizers }}
          ISSUE: ${{ inputs.issue }}
          EMAILS: ${{ inputs.emails }}
          CHAPTER_EMAIL: ${{ inputs.chapter_email }}
          MEETUP_URL: ${{ inputs.meetup_url }}
          FORCE: ${{ inputs.force }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          Rscript -e '
            action  <- Sys.getenv("ACTION")
            city    <- Sys.getenv("CITY")
            country <- Sys.getenv("COUNTRY")
            region  <- Sys.getenv("REGION")
            if (!nzchar(region)) region <- NULL
            organizers <- Sys.getenv("ORGANIZERS")
            organizers <- if (nzchar(organizers)) {
              trimws(strsplit(organizers, ",")[[1]])
            } else {
              character(0)
            }
            blank_to_null <- function(x) if (nzchar(x)) x else NULL
            if (action == "confirm") {
              issue <- Sys.getenv("ISSUE")
              if (!nzchar(issue)) stop("the confirm action needs an issue number")
              emails <- trimws(strsplit(Sys.getenv("EMAILS"), ",")[[1]])
              jinx::chapter_confirm_send(
                issue_number = as.integer(issue),
                to = emails,
                email = blank_to_null(Sys.getenv("CHAPTER_EMAIL")),
                meetup_url = blank_to_null(Sys.getenv("MEETUP_URL")),
                force = identical(Sys.getenv("FORCE"), "true")
              )
              quit(save = "no")
            }
            if (action != "website" && !(nzchar(city) && nzchar(country))) {
              stop("the ", action, " action needs both a city and a country")
            }
            if (action == "setup") {
              jinx::chapter_create_setup(
                city = city,
                country = country,
                organizers = organizers,
                region = region
              )
            } else if (action == "website") {
              issue <- Sys.getenv("ISSUE")
              if (!nzchar(issue)) stop("the website action needs an issue number")
              jinx::chapter_onboard_website(
                issue_number = as.integer(issue),
                city = if (nzchar(city)) city,
                country = if (nzchar(country)) country,
                region = region,
                organizers = if (length(organizers)) organizers
              )
            } else {
              jinx::chapter_create_update(city = city, country = country)
            }
          '
