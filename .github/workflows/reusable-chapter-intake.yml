name: Reusable · Chapter Intake

on:
  workflow_call:
    secrets:
      JINX_APP_ID:
        required: true
      JINX_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  relay:
    if: >-
      github.event.action == 'opened' &&
      (
        contains(github.event.issue.labels.*.name, 'new chapter: first contact') ||
        contains(github.event.issue.labels.*.name, 'updating chapter data')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Mint jinx-familiar App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JINX_APP_ID }}
          private-key: ${{ secrets.JINX_PRIVATE_KEY }}
          owner: rladies
          repositories: jinx

      - name: Relay the new issue to jinx
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORIGIN_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          jq -n \
            --arg repo "$ORIGIN_REPO" \
            --arg issue "$ISSUE" \
            '{
              event_type: "chapter-intake",
              client_payload: { repo: $repo, issue: $issue }
            }' |
            gh api --method POST /repos/rladies/jinx/dispatches --input -
