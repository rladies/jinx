name: Infra · Build Docs (pkgdown)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "R/**"
      - "man/**"
      - "vignettes/**"
      - "DESCRIPTION"
      - "README.md"
      - "PRIVACY.md"
      - "_pkgdown.yml"
      - ".github/workflows/infra-pkgdown.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  pages: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pkgdown-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    container:
      image: ghcr.io/rladies/jinx-bot:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      # The image carries R and the dependency tree, so this only tops up
      # what it lacks: pkgdown, the Config/Needs/website packages (the cloak
      # template lives on GitHub, so dependency resolution alone misses it),
      # and anything DESCRIPTION gained since the image was last published.
      # Installing at run time rather than baking pkgdown into the image
      # keeps the docs job from waiting on an image rebuild - including on
      # the PR that adds the dependency.
      - name: Install missing documentation dependencies
        run: |
          desc <- read.dcf("DESCRIPTION")
          website <- if ("Config/Needs/website" %in% colnames(desc)) {
            trimws(strsplit(desc[1, "Config/Needs/website"], ",")[[1]])
          } else {
            character()
          }
          pak::pak(
            c("deps::.", "pkgdown", website),
            dependencies = TRUE,
            upgrade = FALSE,
            ask = FALSE
          )
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload site
        if: >-
          github.event_name == 'release' ||
          (github.event_name != 'pull_request' &&
           github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs
          retention-days: 1

  # Deploying stays on the runner: the bot image exists to run jinx, and the
  # deploy action wants a git binary the image makes no promise about.
  deploy:
    needs: pkgdown
    if: >-
      github.event_name == 'release' ||
      (github.event_name != 'pull_request' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: pkgdown-site
          path: docs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
