name: Reusable · Jinx Commands

on:
  workflow_call:
    secrets:
      JINX_APP_ID:
        required: true
      JINX_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  relay:
    if: >-
      startsWith(github.event.comment.body, '/jinx ') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Mint jinx-familiar App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JINX_APP_ID }}
          private-key: ${{ secrets.JINX_PRIVATE_KEY }}
          owner: rladies
          repositories: |
            ${{ github.event.repository.name }}
            jinx

      - name: Acknowledge the command
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_API: ${{ github.event.comment.url }}
        run: |
          gh api --method POST "$COMMENT_API/reactions" -f content=eyes

      - name: Relay to jinx
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORIGIN_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          jq -n \
            --arg repo "$ORIGIN_REPO" \
            --arg comment_id "$COMMENT_ID" \
            '{
              event_type: "github-relay",
              client_payload: { repo: $repo, comment_id: $comment_id }
            }' |
            gh api --method POST /repos/rladies/jinx/dispatches --input -
