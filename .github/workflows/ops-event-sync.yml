name: Ops · Event Sync

on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ops-event-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JINX_APP_ID }}
          private-key: ${{ secrets.JINX_PRIVATE_KEY }}
          owner: rladies

      - name: Checkout jinx
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: rladies/jinx

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # jose is what meetupr's JWT auth signs with. It is correctly in
          # meetupr's Suggests - most users authenticate interactively - but
          # this job always uses JWT, so it has to be installed explicitly.
          extra-packages: local::., any::jose

      - name: Sync events
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # meetupr resolves credentials as <client_name>_<key>, with the
          # prefix from MEETUPR_CLIENT_NAME - hence the lowercase names.
          # These point at the MEETUP_* secrets rather than the older
          # MEETUPR_* ones, which still hold a revoked signing key.
          MEETUPR_CLIENT_NAME: meetupr
          meetupr_client_key: ${{ secrets.MEETUP_CLIENT_KEY }}
          meetupr_jwt_issuer: ${{ secrets.MEETUP_MEMBER_ID }}
          meetupr_jwt_token: ${{ secrets.MEETUP_PRIVATE_KEY }}
        run: |
          Rscript -e 'jinx::event_sync_chapters(dry_run = FALSE)'
