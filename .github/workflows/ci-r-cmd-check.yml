name: CI · R CMD Check

on:
  pull_request:
    # No base-branch filter on purpose: a stacked PR targets the branch
    # below it in the stack, and `branches: [main]` meant every one of
    # those went unchecked until it was retargeted. The paths filter is
    # what keeps this from running on unrelated changes.
    paths:
      - "R/**"
      - "src/**"
      - "tests/**"
      - "man/**"
      - "vignettes/**"
      - "inst/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".Rbuildignore"
  push:
    branches: [main]
    paths:
      - "R/**"
      - "src/**"
      - "tests/**"
      - "man/**"
      - "vignettes/**"
      - "inst/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".Rbuildignore"

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
