# Reusable: posts a thank-you on a merged PR or a closed issue, crediting
# everyone who helped - the author (a different message for first-time vs
# returning contributors), plus co-authors, reviewers and commenters on a
# PR, and assignees and commenters on an issue.
#
# Caller requirements:
#   - permissions: contents: read, packages: read  (needed to pull
#     ghcr.io/rladies/jinx-bot — without packages: read the docker
#     pull fails with "denied")
#   - secrets: JINX_APP_ID, JINX_PRIVATE_KEY (both available as
#     rladies org-level secrets)
#   - jinx[bot] GitHub App installed on the calling repo
#
# See README.md ("Reusable workflows") for the full caller example.
name: Reusable · Thank Contributor

on:
  workflow_call:
    secrets:
      JINX_APP_ID:
        required: true
      JINX_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  thank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.pull_request.merged == true ||
      (github.event_name == 'issues' && github.event.action == 'closed')
    container:
      image: ghcr.io/rladies/jinx-bot:latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.JINX_APP_ID }}
          private-key: ${{ secrets.JINX_PRIVATE_KEY }}
          owner: rladies

      - name: Thank contributor
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          Rscript -e '
            is_pr <- "${{ github.event_name }}" != "issues"
            if (is_pr) {
              jinx::gh_thank_contributor(
                owner = "${{ github.repository_owner }}",
                repo = "${{ github.event.repository.name }}",
                pr_number = ${{ github.event.pull_request.number || 0 }},
                author = "${{ github.event.pull_request.user.login }}"
              )
            } else {
              jinx::gh_thank_issue_contributors(
                owner = "${{ github.repository_owner }}",
                repo = "${{ github.event.repository.name }}",
                number = ${{ github.event.issue.number || 0 }},
                author = "${{ github.event.issue.user.login }}",
                completed = "${{ github.event.issue.state_reason }}" != "not_planned"
              )
            }
          '
