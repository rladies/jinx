name: CI · Good Practice

on:
  pull_request:
    # No base-branch filter on purpose: a stacked PR targets the branch
    # below it in the stack, and `branches: [main]` meant every one of
    # those went unchecked until it was retargeted. The paths filter is
    # what keeps this from running on unrelated changes.
    paths:
      - "R/**"
      - "tests/**"
      - "man/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/scripts/gp-report.R"
      - ".github/workflows/ci-good-practice.yml"

permissions:
  contents: read
  packages: read

jobs:
  gp:
    name: goodpractice check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/rladies/jinx-bot:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.JINX_APP_ID }}
          private-key: ${{ secrets.JINX_PRIVATE_KEY }}
          owner: rladies

      # setup-r spent nine minutes of a fifteen-minute budget on apt
      # installing R system requirements for R CMD check, which the checks
      # in gp-report.R do not run, and the job died before goodpractice
      # started. The bot image already carries R and the dependency tree,
      # so only what it lacks is installed at run time: goodpractice, and
      # anything DESCRIPTION gained since the image was published.
      - name: Install missing goodpractice dependencies
        run: |
          pak::pak(
            c("deps::.", "goodpractice"),
            dependencies = TRUE,
            upgrade = FALSE,
            ask = FALSE
          )
        shell: Rscript {0}

      - name: Run goodpractice
        id: gp
        run: Rscript .github/scripts/gp-report.R

      - name: Post report
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            let report;
            if (fs.existsSync('gp_report.md')) {
              report = fs.readFileSync('gp_report.md', 'utf8');
            } else {
              report = '⚠️ **Good Practice Check**\n\ngoodpractice failed to run — check the workflow logs.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '**Good Practice Check**';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );
            const body = report + '\n\n*Updated: ' + new Date().toISOString() + '*';
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
